name: Release Gate

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ">=3.14.10 <3.15"
          check-latest: true
          cache: pip
          cache-dependency-path: .github/uv.lock

      - name: Set up locked uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: .github/uv.lock
          enable-cache: false

      - name: Export hash-pinned validation dependencies
        run: |
          uv export --quiet --directory .github --locked --offline --only-group build \
            --no-emit-project --format requirements.txt \
            --output-file "$RUNNER_TEMP/smartguard-build.txt"
          uv export --quiet --directory .github --locked --offline --only-group ci \
            --no-emit-project --format requirements.txt \
            --output-file "$RUNNER_TEMP/smartguard-ci.txt"

      - name: Install pinned build tools
        run: >-
          python -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r "$RUNNER_TEMP/smartguard-build.txt"

      - name: Install validation dependencies
        # pyric publishes only a source archive. Its build uses pinned tools.
        run: >-
          python -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all: --no-binary=pyric
          --no-build-isolation --no-deps -r "$RUNNER_TEMP/smartguard-ci.txt"

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Verify annotated tag, version, and main ancestry
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = "tag"
          test "$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          python scripts/release.py verify-tag --tag "$RELEASE_TAG"

      - name: Validate repository invariants
        run: python scripts/validate.py

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run strict MyPy checks
        run: >-
          python -m mypy
          custom_components/meiertobler_smartguard
          scripts/release.py
          tests/test_release.py

      - name: Run tests
        run: >-
          python -m pytest -q
          --disable-socket --allow-hosts=127.0.0.1,::1
          --cov=custom_components/meiertobler_smartguard
          --cov-report=term-missing
          --cov-fail-under=95

      - name: Build deterministic release bundle
        run: python scripts/release.py build --output-directory dist

      - name: Upload gated release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meiertobler_smartguard-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
