[project]
name = "ha-meiertobler-smartguard"
version = "0.2.0"
description = "Home Assistant custom integration for Meier Tobler SmartGuard"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Martin Schafer" }]
dependencies = []

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["ASYNC", "B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
follow_imports = "skip"
warn_unreachable = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["custom_components/meiertobler_smartguard"]

[tool.coverage.report]
fail_under = 95
show_missing = true
