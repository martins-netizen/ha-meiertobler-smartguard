name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r .github/requirements-ci.txt

      - name: Validate repository invariants
        run: python scripts/validate.py

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run strict MyPy checks for the independent API layer
        run: >-
          python -m mypy
          custom_components/meiertobler_smartguard/api.py
          custom_components/meiertobler_smartguard/const.py
          tests/test_api.py

      - name: Run tests
        run: >-
          python -m pytest -q
          --cov=custom_components/meiertobler_smartguard
          --cov-report=term-missing
          --cov-fail-under=95

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run hassfest validation
        uses: home-assistant/actions/hassfest@58bff37c8947f690ace498be413a9b78d6f30f93 # master 2026-09-19

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate HACS metadata available in the private repository
        run: python scripts/validate.py

      - name: Run official HACS validation after publication
        if: ${{ github.event.repository.private == false }}
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          comment: false
