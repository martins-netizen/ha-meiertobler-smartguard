rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration does not register custom service actions.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: The integration does not register custom service actions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: exempt
    comment: The integration does not subscribe to device events.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: Version 0.3.0 uses the verified unauthenticated local HTTP API.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: todo
    comment: No reliable local discovery mechanism has been verified.
  discovery-update-info:
    status: exempt
    comment: Discovery is not implemented.
  docs-data-update: done
  docs-examples:
    status: todo
    comment: A stable public blueprint link exists; import and end-to-end migration testing remain.
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: One fixed SmartGuard gateway is represented per config entry.
  entity-category:
    status: exempt
    comment: Version 0.3.0 exposes only primary measurement and control entities.
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: All version 0.3.0 entities are part of the verified functional core.
  entity-translations: done
  exception-translations: done
  icon-translations:
    status: exempt
    comment: Entities use Home Assistant platform and device-class icons.
  reconfiguration-flow: done
  repair-issues:
    status: todo
    comment: Repair issues will be added only for actionable permanent failures.
  stale-devices:
    status: exempt
    comment: The integration does not dynamically create or remove child devices.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
