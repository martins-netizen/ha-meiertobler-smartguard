name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Tests (HA ${{ matrix.ha }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_OFFLINE: "true"
      CI_GROUP: ${{ matrix.group }}
      HA_VERSION: ${{ matrix.ha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha: "2026.11.0"
            group: ci
          - ha: "2026.11.1"
            group: ci-current
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ">=3.14.10 <3.15"
          check-latest: true
          cache: pip
          cache-dependency-path: ci/uv.lock
      - name: Check bootstrap security baseline
        run: python scripts/check_ci_security.py bootstrap
      - name: Set up locked uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version-file: ci/uv.lock
          enable-cache: false
      - name: Export hash-pinned validation dependencies
        run: |
          uv export --quiet --directory ci --locked --offline --only-group build \
            --no-emit-project --format requirements.txt \
            --output-file "$RUNNER_TEMP/smartguard-build.txt"
          uv export --quiet --directory ci --locked --offline --only-group "$CI_GROUP" \
            --no-emit-project --format requirements.txt \
            --output-file "$RUNNER_TEMP/smartguard-ci.txt"
      - name: Install pinned build tools
        run: >-
          python -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r "$RUNNER_TEMP/smartguard-build.txt"
      - name: Install validation dependencies
        # pyric is the only source-build exception; build tools are already pinned.
        run: >-
          python -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all: --no-binary=pyric
          --no-build-isolation --no-deps -r "$RUNNER_TEMP/smartguard-ci.txt"
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Check installed security baseline and HA identity
        run: python scripts/check_ci_security.py installed --ha-version "$HA_VERSION"
      - name: Validate repository invariants
        run: python scripts/validate.py
      - name: Run Ruff
        run: python -m ruff check .
      - name: Run strict MyPy checks
        run: >-
          python -m mypy
          custom_components/meiertobler_smartguard
          scripts/release.py
          scripts/check_ci_security.py
          scripts/check_quality_coverage.py
          tests/test_release.py
      - name: Run complete test suite
        run: >-
          python -m pytest -q
          --disable-socket --allow-hosts=127.0.0.1,::1
          --cov=custom_components/meiertobler_smartguard
          --cov-report=term-missing --cov-report=json:coverage.json
          --cov-fail-under=100
      - name: Require full coverage of every integration module
        run: python scripts/check_quality_coverage.py

  advisories:
    name: Test dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_OFFLINE: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ">=3.14.10 <3.15"
          check-latest: true
      - name: Check bootstrap security baseline
        run: python scripts/check_ci_security.py bootstrap
      - name: Set up locked uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version-file: ci/uv.lock
          enable-cache: false
      - name: Export hash-pinned audit parser dependencies
        run: >-
          uv export --quiet --directory ci --locked --offline --only-group build
          --no-emit-project --format requirements.txt
          --output-file "$RUNNER_TEMP/smartguard-audit.txt"
      - name: Install hash-pinned audit parser dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all: --no-deps
          -r "$RUNNER_TEMP/smartguard-audit.txt"
      - name: Audit every locked package and platform
        run: python -m scripts.check_dependency_advisories --json > "$RUNNER_TEMP/smartguard-dependency-audit.json"

  codeql:
    name: Analyze Python
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only this analysis job may upload security results, never repository contents.
    # Keep pull_request; fork PRs must not gain privileged secrets or write tokens.
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: python
      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          category: /language:python

  quality:
    name: Quality
    needs: [compatibility, advisories, codeql]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both HAs and all security checks
        env:
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          ADVISORIES_RESULT: ${{ needs.advisories.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
        run: >-
          test "$COMPATIBILITY_RESULT" = success &&
          test "$ADVISORIES_RESULT" = success &&
          test "$CODEQL_RESULT" = success

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run hassfest validation
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate HACS metadata available in the private repository
        run: python scripts/validate.py
      - name: Run official HACS validation after publication
        if: ${{ github.event.repository.private == false }}
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a
        with:
          category: integration
          comment: false
