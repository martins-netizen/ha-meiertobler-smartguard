name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Tests (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Current HA
            requirements: ci
          - label: Minimum HA
            requirements: ci-minimum
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ">=3.14.10 <3.15"
          check-latest: true
          cache: pip
          cache-dependency-path: |
            .github/requirements-build.txt
            .github/requirements-${{ matrix.requirements }}.txt

      - name: Install pinned build tools
        run: >-
          python -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r .github/requirements-build.txt

      - name: Install validation dependencies
        # These two transitive test dependencies publish source archives only.
        # Hashes and preinstalled build tools also cover their permitted builds.
        run: >-
          python -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all: --no-binary=mock-open,pyric
          --no-build-isolation --no-deps -r .github/requirements-${{ matrix.requirements }}.txt

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Validate repository invariants
        run: python scripts/validate.py

      - name: Run Ruff
        if: matrix.requirements == 'ci'
        run: python -m ruff check .

      - name: Run strict MyPy checks
        if: matrix.requirements == 'ci'
        run: >-
          python -m mypy
          custom_components/meiertobler_smartguard
          scripts/release.py
          tests/test_release.py

      - name: Run tests
        run: >-
          python -m pytest -q
          --disable-socket --allow-hosts=127.0.0.1,::1
          --cov=custom_components/meiertobler_smartguard
          --cov-report=term-missing
          --cov-fail-under=95

  # Retain the protected check name and require every compatibility job.
  quality:
    name: Quality
    needs: compatibility
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every compatibility environment to pass
        env:
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
        run: test "$COMPATIBILITY_RESULT" = success

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run hassfest validation
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master 2026-09-19

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate HACS metadata available in the private repository
        run: python scripts/validate.py

      - name: Run official HACS validation after publication
        if: ${{ github.event.repository.private == false }}
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          comment: false
