blueprint:
  name: SmartGuard – Nachtumschaltung mit Rückkehr zu Auto
  description: |-
    Wechselt nachts bei Kühlbetrieb von Auto auf Heizen, bis zur eingestellten
    Raumtemperaturgrenze. Morgens geht die Automation nach ihrem eigenen
    Nachtwechsel wieder auf Auto zurück.

    **Einrichtung:** Gehe die Abschnitte 1 bis 4 durch. Lass die beiden Schalter
    während der Einrichtung ausgeschaltet. Die Freigabe schaltest du erst ein,
    wenn diese Automation die Nachtumschaltung übernehmen soll.
  domain: automation
  author: martins-netizen
  homeassistant:
    min_version: 2026.9.0
  input:
    safeguards:
      name: 1. Zwei Helfer vorbereiten
      icon: mdi:shield-check
      description: |-
        Erstelle unter **Einstellungen → Geräte & Dienste → Helfer →
        Helfer erstellen → Umschalter** zwei getrennte Umschalter:

        1. **SmartGuard Blueprint – Freigabe**
        2. **SmartGuard Blueprint – Nachtmerker**

        Lass beide **aus** und wähle sie unten aus. Jede Automation braucht
        ihren eigenen Nachtmerker.
      input:
        enable_helper:
          name: Freigabeschalter
          description: >-
            Wähle „SmartGuard Blueprint – Freigabe“. Dieser Schalter erlaubt
            neue automatische Nachtwechsel. Lass den Umschalter während der
            Einrichtung ausgeschaltet.
          selector:
            entity:
              filter:
                - domain: input_boolean
        override_helper:
          name: Nachtmerker
          description: >-
            Wähle den zweiten Umschalter „SmartGuard Blueprint – Nachtmerker“.
            Die Automation merkt sich damit ihren Wechsel auf Heizen.
            Verwende ihn ausschliesslich für diese Automation und lass seinen
            Zustand nach einem Neustart wiederherstellen. Der Merker wird
            automatisch geschaltet.
          selector:
            entity:
              filter:
                - domain: input_boolean
    smartguard_entities:
      name: 2. SmartGuard auswählen
      icon: mdi:heat-pump
      description: Wähle beide Entitäten vom selben SmartGuard-Gerät.
      input:
        mode_select:
          name: Betriebsmodus einstellen
          description: Wähle die SmartGuard-Auswahl „HK60 Betriebsmodus einstellen“.
          selector:
            entity:
              filter:
                - integration: meiertobler_smartguard
                  domain: select
        operating_status:
          name: Aktueller Betriebsstatus
          description: >-
            Wähle „HK60 Betriebsstatus“. Dieser Sensor zeigt die aktuelle
            Tätigkeit der Anlage an, zum Beispiel Heizen oder Kühlen.
          selector:
            entity:
              filter:
                - integration: meiertobler_smartguard
                  domain: sensor
    temperature_settings:
      name: 3. Raumtemperatur prüfen
      icon: mdi:home-thermometer
      input:
        indoor_temperature:
          name: Raumtemperaturfühler
          description: >-
            Wähle einen Raumfühler oder deinen vorhandenen Sensor für die
            höchste Raumtemperatur. Der Wert muss in °C vorliegen.
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature
        maximum_indoor_temperature:
          name: Temperaturgrenze für den Nachtwechsel
          description: >-
            Bis zu dieser Raumtemperatur darf nachts auf Heizen gewechselt
            werden, einschliesslich des Grenzwerts. Das ist eine
            Freigabegrenze; die Heizungsregelung übernimmt weiterhin SmartGuard.
          default: 25.0
          selector:
            number:
              min: 15.0
              max: 30.0
              step: 0.1
              unit_of_measurement: °C
              mode: box
    schedule:
      name: 4. Schaltzeiten (optional)
      icon: mdi:clock-outline
      description: >-
        Vorgaben sind 23:00 Uhr für den Nachtwechsel und 06:00 Uhr für die
        Rückkehr zu Auto. Es gilt die in Home Assistant eingestellte Zeitzone.
      collapsed: true
      input:
        heating_time:
          name: Nachts auf Heizen wechseln um
          default: "23:00:00"
          selector:
            time:
        auto_time:
          name: Morgens zurück auf Auto um
          default: "06:00:00"
          selector:
            time:

variables:
  mode_select_entity: !input mode_select
  operating_status_entity: !input operating_status
  enable_helper_entity: !input enable_helper
  override_helper_entity: !input override_helper
  indoor_temperature_entity: !input indoor_temperature
  maximum_temperature: !input maximum_indoor_temperature

triggers:
  - trigger: time
    at: !input heating_time
    id: select_heating
  - trigger: time
    at: !input auto_time
    id: return_auto
  - trigger: state
    entity_id: !input mode_select
    to:
      - auto
      - normal
      - reduced
      - frost_protection
      - cooling
    id: clear_override

conditions:
  - condition: template
    value_template: "{{ enable_helper_entity != override_helper_entity }}"

actions:
  - choose:
      - alias: Select heating only when every safeguard passes
        conditions:
          - condition: trigger
            id: select_heating
          - condition: template
            value_template: >-
              {{ is_state(enable_helper_entity, 'on')
                 and is_state(override_helper_entity, 'off')
                 and is_state(mode_select_entity, 'auto')
                 and is_state(operating_status_entity, 'cooling')
                 and state_attr(indoor_temperature_entity, 'unit_of_measurement') == '°C'
                 and is_number(states(indoor_temperature_entity))
                 and (states(indoor_temperature_entity) | float(999))
                     <= (maximum_temperature | float) }}
        sequence:
          - action: select.select_option
            target:
              entity_id: !input mode_select
            data:
              option: heating
          - condition: template
            value_template: "{{ is_state(mode_select_entity, 'heating') }}"
          - action: input_boolean.turn_on
            target:
              entity_id: !input override_helper
      - alias: Return only the blueprint's heating mode to auto
        conditions:
          - condition: trigger
            id: return_auto
          - condition: template
            value_template: >-
              {{ is_state(override_helper_entity, 'on')
                 and is_state(mode_select_entity, 'heating') }}
        sequence:
          - action: select.select_option
            target:
              entity_id: !input mode_select
            data:
              option: auto
          - condition: template
            value_template: "{{ is_state(mode_select_entity, 'auto') }}"
          - action: input_boolean.turn_off
            target:
              entity_id: !input override_helper
      - alias: Forget ownership after a known different mode
        conditions:
          - condition: trigger
            id:
              - clear_override
              - return_auto
          - condition: template
            value_template: >-
              {{ is_state(override_helper_entity, 'on')
                 and (trigger.id == 'clear_override' or
                      states(mode_select_entity) in
                      ['auto', 'normal', 'reduced', 'frost_protection', 'cooling']) }}
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: !input override_helper

mode: queued
max: 10
