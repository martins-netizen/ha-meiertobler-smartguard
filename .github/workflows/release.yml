name: Release Gate

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r .github/requirements-ci.txt

      - name: Verify annotated tag, version, and main ancestry
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = "tag"
          test "$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          python scripts/release.py verify-tag --tag "$RELEASE_TAG"

      - name: Validate repository invariants
        run: python scripts/validate.py

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run strict MyPy checks
        run: >-
          python -m mypy
          custom_components/meiertobler_smartguard
          scripts/release.py
          tests/test_release.py

      - name: Run tests
        run: >-
          python -m pytest -q
          --cov=custom_components/meiertobler_smartguard
          --cov-report=term-missing
          --cov-fail-under=95

      - name: Build deterministic release bundle
        run: python scripts/release.py build --output-directory dist

      - name: Upload gated release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meiertobler_smartguard-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
