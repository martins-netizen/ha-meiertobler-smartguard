# Automatic SonarQube Cloud analysis; retain the whole repository as source scope.
sonar.sources=.
# Test rules apply to tests; keep the binary brand icon out of source analysis.
sonar.tests=tests
sonar.exclusions=tests/**,custom_components/meiertobler_smartguard/brand/icon.png,docs/images/*.png
# Match requires-python >=3.13 and the currently supported Python minor versions.
sonar.python.version=3.13,3.14
# All repository text files are UTF-8; never reinterpret or rewrite their bytes.
sonar.sourceEncoding=UTF-8
