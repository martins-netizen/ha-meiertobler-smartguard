rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: exempt
    comment: The integration does not subscribe to device events.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: The verified local HTTP API does not authenticate integration requests.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: todo
    comment: No reliable local discovery mechanism has been verified.
  discovery-update-info:
    status: exempt
    comment: Discovery is not implemented.
  docs-data-update: done
  docs-examples:
    status: todo
    comment: The blueprint has automated import and execution tests; UI import and production migration confirmation remain.
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: One fixed SmartGuard gateway is represented per config entry.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: done
    comment: Diagnostic operating-hour counters default to disabled for new registry entries; existing activation choices and entity IDs are preserved.
  entity-translations: done
  exception-translations: done
  icon-translations:
    status: exempt
    comment: Entities use Home Assistant platform and device-class icons.
  reconfiguration-flow: done
  repair-issues:
    status: done
    comment: Entry-specific repairs explain invalid saved hosts, unsupported devices and changed gateway identities; transient communication failures keep normal retries.
  stale-devices:
    status: exempt
    comment: The integration does not dynamically create or remove child devices.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
